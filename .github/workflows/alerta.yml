name: Notificacion Hello World

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Ejecutar Hello World
        run: python main.py

      - name: Enviar notificacion
        run: |
          curl -H "Title: GitHub Actions" \
               -d "Hola! Se subio codigo a la rama main del repositorio ${{ github.repository }}" \
               https://ntfy.sh/devops-itla
